# ============================================================
# Inventory: имена хостов = FQDN (.ru-central1.internal),
# приватные ВМ доступны только через бастион (ProxyCommand).
# IP бастиона указан в двух местах: [bastion] и строка
# ProxyCommand ниже. При смене IP править только эти две строки.
# ============================================================

[bastion]
bastion ansible_host=178.154.214.208

[web]
web-01.ru-central1.internal
web-02.ru-central1.internal

[elastic]
elastic-01.ru-central1.internal

[kibana]
kibana-01.ru-central1.internal

[zabbix]
zabbix-01.ru-central1.internal

# Все приватные ВМ — дочерняя группа: ходим только через бастион
[internal:children]
web
elastic
kibana
zabbix

[internal:vars]
ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -q osboxes@178.154.214.208"'

[all:vars]
ansible_user=osboxes
ansible_ssh_private_key_file=~/.ssh/id_rsa
